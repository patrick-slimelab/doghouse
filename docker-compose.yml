services:
  doghouse:
    build:
      context: .
      args:
        MOLTBOT_REPO: https://github.com/patrick-slimelab/moltbot.git
        MOLTBOT_REF: ${MOLTBOT_REF:-main}
    container_name: doghouse
    restart: unless-stopped

    # Allow container to reach host services without --network=host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # Point Scoob's OpenAI-compatible client to the host ooba server
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:5000}

      # Force state/config dirs so Moltbot doesn't try to migrate ~/.clawdbot -> ~/.moltbot
      CLAWDBOT_STATE_DIR: /home/node/.moltbot
      CLAWDBOT_CONFIG_PATH: /home/node/.moltbot/moltbot.json

      # Help TUIs behave
      TERM: xterm-256color

      # Keep Node quieter
      NODE_ENV: production

    stdin_open: true
    tty: true

    # Persist Scoob's state + workspace
    volumes:
      - doghouse_state:/home/node/.moltbot
      - doghouse_workspace:/home/node/clawd

    secrets:
      - discord_bot_token
      - matrix_homeserver
      - matrix_user_id
      - matrix_password

    # Lockdown (prevents easy host escape)
    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    # If Scoob needs to bind ports, add explicit mappings here.
    # ports:
    #   - "${DOGHOUSE_PORT:-7861}:7860"

secrets:
  discord_bot_token:
    file: ./secrets/discord_bot_token
  matrix_homeserver:
    file: ./secrets/matrix_homeserver
  matrix_user_id:
    file: ./secrets/matrix_user_id
  matrix_password:
    file: ./secrets/matrix_password

volumes:
  doghouse_state:
  doghouse_workspace:
