services:
  doghouse-init:
    image: alpine:3.19
    container_name: doghouse-init
    restart: "no"
    command:
      - sh
      - -lc
      - |
        set -e
        # Fix permissions on persisted volumes for uid/gid 1001 (scoob)
        mkdir -p /home/scoob/.moltbot /home/scoob
        chown -R 1001:1001 /home/scoob/.moltbot /home/scoob || true
    volumes:
      - doghouse_state:/home/scoob/.moltbot
      - doghouse_workspace:/home/scoob

  doghouse:
    build:
      context: .
      args:
        MOLTBOT_REPO: https://github.com/patrick-slimelab/moltbot.git
        MOLTBOT_REF: ${MOLTBOT_REF:-main}
    container_name: doghouse
    restart: unless-stopped
    depends_on:
      doghouse-init:
        condition: service_completed_successfully

    # Allow container to reach host services without --network=host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # Point Scoob's OpenAI-compatible client to the host ooba server
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:5000}

      # Force state/config dirs so Moltbot doesn't try to migrate ~/.clawdbot -> ~/.moltbot
      CLAWDBOT_STATE_DIR: /home/scoob/.moltbot
      CLAWDBOT_CONFIG_PATH: /home/scoob/.moltbot/moltbot.json
      DOGHOUSE_WORKSPACE: /home/scoob

      # Help TUIs behave
      TERM: xterm-256color

      # Keep Node quieter
      NODE_ENV: production

    stdin_open: true
    tty: true

    # Persist Scoob's state + workspace
    volumes:
      - doghouse_state:/home/scoob/.moltbot
      - doghouse_workspace:/home/scoob

    secrets:
      - discord_bot_token
      - matrix_homeserver
      - matrix_user_id
      - matrix_password
      - gateway_token
      - authorized_keys

    # Lockdown (disabled for stability)
    read_only: false
    # tmpfs:
    #   - /tmp
    #   - /run

    security_opt:
      - no-new-privileges:false

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    # Expose SSH (2222->2222) and Gateway (7861->18789 if needed)
    ports:
      - "127.0.0.1:2222:2222"
      # - "${DOGHOUSE_PORT:-7861}:7860"

secrets:
  discord_bot_token:
    file: ./secrets/discord_bot_token
  matrix_homeserver:
    file: ./secrets/matrix_homeserver
  matrix_user_id:
    file: ./secrets/matrix_user_id
  matrix_password:
    file: ./secrets/matrix_password
  gateway_token:
    file: ./secrets/gateway_token
  authorized_keys:
    file: ./secrets/authorized_keys

volumes:
  doghouse_state:
  doghouse_workspace:
