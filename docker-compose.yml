services:
  scrappy-init:
    image: alpine:3.19
    container_name: scrappy-init
    restart: 'no'
    command:
    - sh
    - -lc
    - 'set -e

      # Fix permissions on persisted volumes for uid/gid 1001 (scrappy)

      mkdir -p /home/scrappy/.openclaw /home/scrappy

      chown -R 1001:1001 /home/scrappy/.openclaw /home/scrappy || true

      '
    volumes:
    - scrappy_state:/home/scrappy/.openclaw
    - scrappy_workspace:/home/scrappy
  mongo:
    image: mongo:6
    container_name: scrappy-mongo
    restart: unless-stopped
    volumes:
    - scrappy_mongo:/data/db
  scrappy:
    build:
      context: .
      args:
        MOLTBOT_REPO: https://github.com/patrick-slimelab/openclaw.git
        MOLTBOT_REF: main
    container_name: scrappy
    restart: unless-stopped
    depends_on:
      scrappy-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      FORCE_DEFAULT_MODEL_OLLAMA: ollama/frob/qwen3-coder-next:80b-a3b-f16
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:5000}
      OPENCLAW_STATE_DIR: /home/scrappy/.openclaw
      OPENCLAW_CONFIG_PATH: /home/scrappy/.openclaw/openclaw.json
      DOGHOUSE_WORKSPACE: /home/scrappy
      TERM: xterm-256color
      NODE_ENV: production
      OPENCLAW_GATEWAY_PORT: 4000
      # Default model (Ollama)
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      DISCORD_GUILD_IDS: 
    stdin_open: true
    tty: true
    volumes:
    - scrappy_state:/home/scrappy/.openclaw
    - scrappy_workspace:/home/scrappy
    secrets:
    - discord_bot_token
    - gateway_token
    - brave_api_key
    - authorized_keys
    - id_ed25519
    - gh_token
    - mediawiki_url
    - mediawiki_user
    - mediawiki_password
    read_only: false
    security_opt:
    - no-new-privileges:false
    ports:
    - 127.0.0.1:2223:2222
    - 127.0.0.1:4001:4000
    - 5001:5000
    command:
    - openclaw
    - gateway
    - run
    - --port
    - '4000'
secrets:
  discord_bot_token:
    file: ./secrets/discord_bot_token
  gateway_token:
    file: ./secrets/gateway_token
  brave_api_key:
    file: ./secrets/brave_api_key
  authorized_keys:
    file: ./secrets/authorized_keys
  id_ed25519:
    file: ./secrets/id_ed25519
  gh_token:
    file: ./secrets/gh_token
  mediawiki_url:
    file: ./secrets/mediawiki_url
  mediawiki_user:
    file: ./secrets/mediawiki_user
  mediawiki_password:
    file: ./secrets/mediawiki_password
volumes:
  scrappy_state: null
  scrappy_workspace: null
  scrappy_mongo: null
