services:
  doghouse-init:
    image: alpine:3.19
    container_name: ${BOT_CANONICAL_NAME:-scoob}-doghouse-init
    environment:
      BOT_CANONICAL_NAME: ${BOT_CANONICAL_NAME:-scoob}
    restart: "no"
    command:
      - sh
      - -lc
      - |
        set -e
        # Fix permissions on persisted volumes for uid/gid 1001 (scoob)
        # NOTE: We no longer mount the workspace at /home/scoob. Workspace now lives at ~/.openclaw/workspace.
        mkdir -p /home/scoob/.openclaw /home/scoob/.openclaw/workspace
        chown -R 1001:1001 /home/scoob/.openclaw || true

        # Ensure config is readable by scoob (some past runs may have created it as root:root 0600)
        if [ -f /home/scoob/.openclaw/openclaw.json ]; then
          chown 1001:1001 /home/scoob/.openclaw/openclaw.json || true
          chmod 600 /home/scoob/.openclaw/openclaw.json || true
        fi
        chmod 700 /home/scoob/.openclaw || true
    volumes:
      - doghouse_state:/home/scoob/.openclaw
      - doghouse_home:/home/scoob
      - doghouse_workspace:/home/scoob/_workspace_legacy:ro

  mongo:
    image: mongo:6
    container_name: ${BOT_CANONICAL_NAME:-scoob}-doghouse-mongo
    restart: unless-stopped
    volumes:
      - doghouse_mongo:/data/db

  doghouse:
    build:
      context: .
      args:
        # Use upstream OpenClaw for a fresh, known-good engine
        MOLTBOT_REPO: https://github.com/slimelab-ai/openpaw.git
        # Pin to the 2026.2.3 release (matches current version in logs)
        MOLTBOT_REF: model/qwen3-coder-next
        # Cache-bust so docker build pulls latest branch head/tag when redeploying
        MOLTBOT_CACHE_BUST: ${MOLTBOT_CACHE_BUST:-4}
    container_name: ${BOT_CANONICAL_NAME:-scoob}-doghouse
    restart: unless-stopped
    depends_on:
      doghouse-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started

    # Allow container to reach host services without --network=host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Pre-auth GitHub CLI via GH_TOKEN in ./secrets/github.env
    env_file:
      - ./secrets/github.env

    environment:
      FORCE_DEFAULT_MODEL_OLLAMA: ollama/qwen3-coder-next:q4_K_M
      # Git-backed workspace: rebase Scoob's private workspace branch onto this baseline branch
      DOGHOUSE_WORKSPACE_BASELINE_BRANCH: model/qwen3-coder-next
      # Force dog workspace branch (do NOT leave repo on legacy 'master')
      DOGHOUSE_WORKSPACE_BRANCH: main
      # Point Scoob's OpenAI-compatible client to the host Ollama server
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434}

      # Force state/config dirs so Moltbot doesn't try to migrate ~/.clawdbot -> ~/.moltbot
      OPENCLAW_STATE_DIR: /home/scoob/.openclaw
      OPENCLAW_CONFIG_PATH: /home/scoob/.openclaw/openclaw.json
      # OpenClaw workspace root (git-backed). We use /home/scoob to match legacy layout.
      DOGHOUSE_WORKSPACE: /home/scoob

      # Help TUIs behave
      TERM: xterm-256color

      # Keep Node quieter
      NODE_ENV: production
      # Force gateway port
      OPENCLAW_GATEWAY_PORT: 4000
      # Default model (Ollama)
      # Discord/Matrix credentials (loaded from secrets by entrypoint, but also need to be in env for gateway)
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      MATRIX_HOMESERVER_FILE: /run/secrets/matrix_homeserver
      MATRIX_USER_ID_FILE: /run/secrets/matrix_user_id
      MATRIX_PASSWORD_FILE: /run/secrets/matrix_password

    stdin_open: true
    tty: true

    # Persist Scoob's state + home/workspace
    volumes:
      - doghouse_home:/home/scoob
      - doghouse_state:/home/scoob/.openclaw
      - doghouse_workspace:/home/scoob/_workspace_legacy:ro

    secrets:
      - discord_bot_token
      - matrix_homeserver
      - matrix_user_id
      - matrix_password
      - gateway_token
      - brave_api_key
      - mediawiki_url
      - mediawiki_user
      - mediawiki_password
      - authorized_keys
      - id_ed25519
      - gh_token

    # Lockdown (disabled for stability)
    read_only: false
    # tmpfs:
    #   - /tmp
    #   - /run

    security_opt:
      - no-new-privileges:false

    # Caps configuration removed to allow sudo

    # Expose SSH (2222->2222) and Gateway (4000)
    ports:
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:4000:4000"
      - "5000:5000"

secrets:
  discord_bot_token:
    file: ./secrets/discord_bot_token
  matrix_homeserver:
    file: ./secrets/matrix_homeserver
  matrix_user_id:
    file: ./secrets/matrix_user_id
  matrix_password:
    file: ./secrets/matrix_password
  gateway_token:
    file: ./secrets/gateway_token
  brave_api_key:
    file: ./secrets/brave_api_key
  mediawiki_url:
    file: ./secrets/mediawiki_url
  mediawiki_user:
    file: ./secrets/mediawiki_user
  mediawiki_password:
    file: ./secrets/mediawiki_password
  authorized_keys:
    file: ./secrets/authorized_keys
  id_ed25519:
    file: ./secrets/id_ed25519
  gh_token:
    file: ./secrets/gh_token

volumes:
  doghouse_state:
    name: ${BOT_CANONICAL_NAME:-scoob}_doghouse_state
  doghouse_home:
    name: ${BOT_CANONICAL_NAME:-scoob}_doghouse_home
  doghouse_workspace:
    name: ${BOT_CANONICAL_NAME:-scoob}_doghouse_workspace_legacy
  doghouse_mongo:
    name: ${BOT_CANONICAL_NAME:-scoob}_doghouse_mongo
